<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Barista - Меню</title>
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }
  
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1a1a2e url('main-bg.jpg') center/cover no-repeat;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(8px);
    overflow: hidden;
  }

  /* --- КОНТРОЛИ ВЕРХНІЙ ПРАВИЙ КУТ --- */
  .top-controls {
    position: absolute;
    top: 25px;
    right: 40px;
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 10;
  }

  .btn-donate {
    padding: 10px 20px;
    border-radius: 12px;
    border: 1px solid rgba(162, 89, 255, 0.5);
    background: rgba(26, 26, 46, 0.6);
    backdrop-filter: blur(10px);
    color: white;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(162, 89, 255, 0.2);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-donate:hover {
    box-shadow: 0 0 25px rgba(162, 89, 255, 0.6);
    background: rgba(162, 89, 255, 0.2);
    transform: translateY(-2px);
  }

  .profile {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(26, 26, 46, 0.6);
    backdrop-filter: blur(10px);
    padding: 6px 15px 6px 6px;
    border-radius: 50px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    cursor: pointer;
    transition: background 0.3s ease;
  }

  .profile:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  .avatar {
    width: 40px;
    height: 40px;
    background: #a259ff;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: white;
    font-size: 1.2rem;
  }

  .nickname {
    color: #fff;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 1px;
  }

  /* --- КАРТКИ РЕЖИМІВ --- */
  .menu-container {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
    z-index: 5;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    width: 320px;
    height: 480px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.4s ease;
  }

  /* Анімація тільки для активних карток */
  .card:not(.locked):hover {
    transform: translateY(-15px);
    box-shadow: 0 20px 50px rgba(162, 89, 255, 0.4);
  }

  .img-wrapper {
    height: 60%;
    width: 100%;
    overflow: hidden;
    position: absolute;
    top: 0;
    left: 0;
  }

  .card-img {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    transition: transform 0.6s ease;
  }

  .card:not(.locked):hover .card-img {
    transform: scale(1.15);
  }

  .img-wrapper::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    right: 0;
    height: 60%;
    background: linear-gradient(to top, #ffffff 10%, transparent);
  }

  .card-content {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 55%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 20px;
    background: linear-gradient(to top, #ffffff 80%, transparent);
  }

  .card-content h2 {
    font-size: 2.8rem;
    font-weight: 900;
    color: #1a1a2e;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 5px;
  }

  .subtitle {
    font-size: 1.1rem;
    color: #a259ff;
    font-weight: 700;
    margin-bottom: 15px;
  }

  .desc {
    font-size: 0.95rem;
    color: #444;
    text-align: center;
    line-height: 1.4;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  .card:not(.locked):hover .desc {
    opacity: 1;
    transform: translateY(0);
  }

  /* --- ЗАБЛОКОВАНІ КАРТКИ --- */
  .card.locked {
    cursor: not-allowed;
    background: #e0e0e0; /* Трохи темніший фон для неактивних */
  }

  .card.locked .card-img {
    filter: grayscale(0.8) blur(2px) brightness(0.6);
  }

  .card.locked .card-content h2,
  .card.locked .subtitle {
    color: #888;
  }

  .locked-badge {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: white;
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    backdrop-filter: blur(5px);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
  }
</style>
</head>
<body>

  <!-- Акаунт і Донат зверху справа -->
  <div class="top-controls">
    <button class="btn-donate">☕ Підтримати</button>
    <div class="profile">
      <div class="avatar">А</div>
      <div class="nickname">Artem</div>
    </div>
  </div>

  <!-- Картки -->
  <div class="menu-container">
    
    <!-- PVP (ЗАБЛОКОВАНО) -->
    <div class="card locked">
      <div class="locked-badge">🔒 В РОЗРОБЦІ</div>
      <div class="img-wrapper">
        <div class="card-img" style="background-image: url('pvp-bg.jpg');"></div>
      </div>
      <div class="card-content">
        <h2>PVP</h2>
        <div class="subtitle">Каво-махалово</div>
        <!-- Опис приховано або не виїжджає, бо режим заблоковано -->
      </div>
    </div>

    <!-- ONLINE (АКТИВНИЙ) -->
    <div class="card">
      <div class="img-wrapper">
        <div class="card-img" style="background-image: url('online-bg.jpg');"></div>
      </div>
      <div class="card-content">
        <h2>ONLINE</h2>
        <div class="subtitle">Чіл-доставка</div>
        <div class="desc">Вари еспресо під лоу-фай, поки тімейт мансує від вигорівших зомбі.</div>
      </div>
    </div>

    <!-- EVENT (ЗАБЛОКОВАНО) -->
    <div class="card locked">
      <div class="locked-badge">🔒 В РОЗРОБЦІ</div>
      <div class="img-wrapper">
        <div class="card-img" style="background-image: url('event-bg.jpg');"></div>
      </div>
      <div class="card-content">
        <h2>ІВЕНТ</h2>
        <div class="subtitle">Рейд на Боса</div>
      </div>
    </div>

  </div>

</body>
</html>
